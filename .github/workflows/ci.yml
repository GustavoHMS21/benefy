# Quality gate obrigatório para todo PR contra develop e main.
# Critérios em docs/empresa/05-padroes-de-engenharia.md.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  descobrir-projetos:
    name: descobrir-projetos
    runs-on: ubuntu-24.04
    outputs:
      projetos: ${{ steps.listar.outputs.projetos }}
    steps:
      - uses: actions/checkout@v5
      - name: Listar projetos Python (services/ e templates/)
        id: listar
        run: |
          projetos=$(find services templates -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' 2>/dev/null | sort | jq -R . | jq -sc .)
          echo "projetos=${projetos}" >> "$GITHUB_OUTPUT"
          echo "Projetos encontrados: ${projetos}"

  python:
    name: python (${{ matrix.projeto }})
    needs: descobrir-projetos
    if: needs.descobrir-projetos.outputs.projetos != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        projeto: ${{ fromJson(needs.descobrir-projetos.outputs.projetos) }}
    defaults:
      run:
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.projeto }}/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Formatação (ruff format)
        run: ruff format --check .
      - name: Testes, BDD e cobertura (pytest)
        run: pytest
      - name: SAST (bandit, severidade alta)
        run: bandit -r src --severity-level high

  sast-semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (python e segredos, severidade alta)
        run: semgrep scan --config p/python --config p/secrets --severity ERROR --error --metrics off

  dados-pessoais:
    name: dados-pessoais
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Procurar CPF e número de cartão em arquivos versionados
        run: python tools/ci/verificar_dados_pessoais.py

  quality-gate:
    name: quality-gate
    if: always()
    needs: [descobrir-projetos, python, sast-semgrep, dados-pessoais]
    runs-on: ubuntu-24.04
    steps:
      - name: Consolidar resultado
        env:
          RESULTADOS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTADOS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
